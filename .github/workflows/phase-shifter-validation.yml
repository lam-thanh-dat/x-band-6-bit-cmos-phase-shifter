name: Validate X-Band Phase-Shifter Analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q scripts tests

      - name: Verify Cadence source integrity
        run: python scripts/verify_cadence_library.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run analysis without figures
        run: |
          python scripts/analyze_phase_shifter.py --no-plots
          python scripts/analyze_nmos_switch.py
          python scripts/calculate_phase_cell_starting_values.py

  reproducibility:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-reproducibility.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-reproducibility.txt

      - name: Verify raw-data checksums
        run: |
          python scripts/verify_cadence_library.py
          python scripts/verify_raw_data_checksums.py

      - name: Regenerate tracked artifacts
        run: |
          python scripts/analyze_phase_shifter.py
          python scripts/analyze_nmos_switch.py
          python scripts/calculate_phase_cell_starting_values.py

      - name: Verify generated files are current
        run: git diff --exit-code -- data/processed results
